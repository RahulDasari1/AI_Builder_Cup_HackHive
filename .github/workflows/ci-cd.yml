name: HackHive CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend flows
        working-directory: frontend
        run: npm run test:ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build .NET microservices
        run: |
          dotnet build backend/Services/Learning.Api/Learning.Api.csproj --configuration Release
          dotnet build backend/Services/AI.Api/AI.Api.csproj --configuration Release
          dotnet build backend/Services/Reports.Api/Reports.Api.csproj --configuration Release
      - name: Run .NET automated tests
        run: dotnet test backend/Tests/HackHive.Tests.csproj --configuration Release --verbosity normal

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Build and deploy Cloud Run services
        shell: bash
        run: |
          set -euo pipefail
          declare -A paths=(
            [learning-api]=backend/Services/Learning.Api/Dockerfile
            [ai-api]=backend/Services/AI.Api/Dockerfile
            [reports-api]=backend/Services/Reports.Api/Dockerfile
          )
          for service in learning-api ai-api reports-api; do
            image="$REGION-docker.pkg.dev/$PROJECT_ID/hackhive/$service:$GITHUB_SHA"
            gcloud builds submit . --project "$PROJECT_ID" --region "$REGION" --config cloudbuild.yaml --substitutions "_DOCKERFILE=${paths[$service]},_IMAGE=$image"
            deploy_args=(
              --project "$PROJECT_ID"
              --region "$REGION"
              --image "$image"
              --allow-unauthenticated
              --service-account "$RUNTIME_SERVICE_ACCOUNT"
              --port 8080
              --memory 512Mi
              --cpu 1
              --max 20
              --set-env-vars "FIREBASE_PROJECT_ID=$PROJECT_ID,WEB_ORIGIN=https://$PROJECT_ID.web.app"
            )
            if [[ "$service" == "ai-api" ]]; then
              deploy_args+=(--set-secrets "GEMINI_API_KEY=gemini-api-key:latest")
            fi
            gcloud run deploy "$service" "${deploy_args[@]}"
            service_url="$(gcloud run services describe "$service" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
            case "$service" in
              learning-api) echo "LEARNING_API_URL=$service_url" >> "$GITHUB_ENV" ;;
              ai-api) echo "AI_API_URL=$service_url" >> "$GITHUB_ENV" ;;
              reports-api) echo "REPORTS_API_URL=$service_url" >> "$GITHUB_ENV" ;;
            esac
          done
      - name: Configure and build production frontend
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_PROJECT_ID }}.firebaseapp.com
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        working-directory: frontend
        run: |
          npm ci
          node ../scripts/write-frontend-config.mjs
          npm run build
      - name: Deploy Firebase Hosting and Firestore rules
        run: npx --yes firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive